  var CIRC=[1503.0,1496.0,1496.0], CROP=[477,924,2048,1024];

  var canvas=document.getElementById('c');
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true,premultipliedAlpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  var scene=new THREE.Scene();
  var HALF=1.04, cam=new THREE.OrthographicCamera(-HALF,HALF,HALF,-HALF,0.1,10); cam.position.z=3;

  var VERT="varying vec3 vL;varying vec3 vV;void main(){vL=normal;vV=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}";
  var FRAG=[
   "precision highp float;",
   "uniform sampler2D tShade,tLogo,tD;uniform vec3 uC;uniform vec4 uCrop;uniform float uBack;",
   "varying vec3 vL;varying vec3 vV;",
   "vec4 lg(vec2 xy){vec2 pix=uC.xy+uC.z*vec2(xy.x,-xy.y);",
   "  vec2 uv=vec2((pix.x-uCrop.x)/uCrop.z,1.0-(pix.y-uCrop.y)/uCrop.w);return texture2D(tLogo,uv);}",
   "void main(){",
   "  vec3 n=normalize(vV);vec2 suv=n.xy*0.5+0.5;",
   "  vec4 base=texture2D(tShade,suv);float D=texture2D(tD,suv).r;",
   "  vec3 p=normalize(vL);",
   "  vec4 f=lg(p.xy);f.a*=smoothstep(0.25,0.4,p.z);",
   "  vec4 b=lg(vec2(-p.x,p.y));b.a*=smoothstep(0.25,0.4,-p.z)*uBack;",
   "  vec4 l=mix(f,b,step(p.z,0.0));",
   "  float G=clamp((base.b-0.12)/0.6,0.0,1.0);",
   "  float lum=dot(l.rgb,vec3(0.3333));",
   "  vec3 lit=l.rgb*vec3(1.0,0.97,0.94)*(1.0+(D-1.0)*0.2)+0.10*(1.0-lum);",
   "  lit=lit*(1.0-0.85*G)+base.rgb*0.85*G;",
   "  vec3 col=mix(base.rgb,lit,l.a);",
   "  gl_FragColor=vec4(col,base.a);",
   "}"].join("\n");

  var mesh=null, loaded=0, tex={};

    t.anisotropy=renderer.capabilities.getMaxAnisotropy(); tex[k]=t; if(++loaded===3) build();});}
  tl('shade',SHADE,false); tl('logo',LOGO,true); tl('d',DMAP,false);

  function build(){
    var mat=new THREE.ShaderMaterial({vertexShader:VERT,fragmentShader:FRAG,transparent:true,
      uniforms:{tShade:{value:tex.shade},tLogo:{value:tex.logo},tD:{value:tex.d},

        uBack:{value:BACK_LOGO?1:0}}});
    mesh=new THREE.Mesh(new THREE.SphereGeometry(1,128,96),mat); scene.add(mesh);
  }

  function resize(){
    var w=canvas.clientWidth||1,h=canvas.clientHeight||1; renderer.setSize(w,h,false);

    cam.top=HALF*Math.max(1,1/a); cam.bottom=-HALF*Math.max(1,1/a); cam.updateProjectionMatrix();
  }
  window.addEventListener('resize',resize); resize();
  if(window.ResizeObserver) new ResizeObserver(resize).observe(canvas);

  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var auto=reduce?0:AUTO_SPIN, dragging=false, lx=0, ly=0, vx=0, vy=0, sx=0, sy=0, st=0;
  var tmp=new THREE.Quaternion(), axis=new THREE.Vector3(), Y=new THREE.Vector3(0,1,0);
  function spin(dx,dy){ // dx,dy in pixels of drag -> free 360 rotation in any direction

    axis.set(dy,dx,0).normalize(); tmp.setFromAxisAngle(axis,ang); mesh.quaternion.premultiply(tmp);
  }
  function overBall(e){
    var r=canvas.getBoundingClientRect(), rad=Math.min(r.width,r.height)/2/HALF;
    return Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))<=rad;
  }
  function go(){ if(LINK_URL.indexOf('YOUR-PORTFOLIO')>-1) return; window.open(LINK_URL,LINK_TARGET); }
  canvas.addEventListener('pointerdown',function(e){
    dragging=true; lx=sx=e.clientX; ly=sy=e.clientY; st=Date.now(); vx=vy=0;
    canvas.setPointerCapture(e.pointerId); canvas.style.cursor='grabbing';
  });
  canvas.addEventListener('pointermove',function(e){
    if(dragging){ var dx=e.clientX-lx,dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
      spin(dx,dy); vx=vx*0.5+dx*0.5; vy=vy*0.5+dy*0.5; }
    else canvas.style.cursor=overBall(e)?'pointer':'default';
  });
  function up(e){
    if(!dragging) return; dragging=false;
    var moved=Math.hypot(e.clientX-sx,e.clientY-sy);
    canvas.style.cursor=overBall(e)?'pointer':'default';
    if(moved<6&&Date.now()-st<450&&overBall(e)){ vx=vy=0; go(); }
  }
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',function(){dragging=false;});
  canvas.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' ') go(); });

  (function loop(){
    requestAnimationFrame(loop);
    if(mesh&&!dragging){
      spin(vx,vy); vx*=FRICTION; vy*=FRICTION;
      if(auto){ tmp.setFromAxisAngle(Y,auto); mesh.quaternion.premultiply(tmp); }
    }
    renderer.render(scene,cam);
  })();
